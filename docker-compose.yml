services:
  web:
    build: .
    image: maskarada:prod
    ports:
      - "3000"
    networks:
      - agent-net
    environment:
      - NODE_ENV=production
    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=agent-net"
        - "traefik.http.routers.maskarada.entrypoints=websecure"
        - "traefik.http.routers.maskarada.rule=Host(`maskarada.paragu-ai.com`)"
        - "traefik.http.routers.maskarada.tls=true"
        - "traefik.http.routers.maskarada.tls.certresolver=letsencryptresolver"
        - "traefik.http.services.maskarada.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  agent-net:
    external: true
